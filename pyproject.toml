[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exodiscovery"
version = "0.1.0"
description = "Local TESS transit investigation workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3",
  "scipy>=1.14,<2", "astropy>=7,<9", "astroquery>=0.4.8,<0.5",
  "lightkurve>=2.5,<3", "batman-package>=2.5,<3", "httpx>=0.28,<1",
  "keyring>=25,<26", "matplotlib>=3.9,<4", "setuptools>=75"
]
[project.optional-dependencies]
test = ["pytest>=8", "httpx"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["network: downloads public archive data (opt in with EXO_NETWORK_TESTS=1)"]
